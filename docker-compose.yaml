services:

  db:
    image: postgres:15
    environment:

      POSTGRES_DB: my_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.settings
    depends_on:
      - db
    volumes:
      - media_data:/app/megano/media
      - static_data:/app/megano/static

  nginx:
    image: nginx:alpine
    volumes:
      - ./megano/config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/usr/share/nginx/html/media:ro
      - static_data:/usr/share/nginx/html/static:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
  static_data:
