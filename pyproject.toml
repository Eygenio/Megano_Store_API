[project]
name = "megano-store-api"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgiref>=3.12.1",
    "colorlog>=6.11.0",
    "django>=6.0.7",
    "django-request-logging>=0.7.5",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "psycopg>=3.3.4",
    "setuptools>=83.0.0",
    "sqlparse>=0.5.5",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pylint (>=4.0.4,<5.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "faker (>=40.4.0,<41.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "django-stubs>=6.0.7",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py312', 'py313']
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | venv
  | migrations
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_django = ["django"]
known_third_party = ["celery", "redis", "drf_spectacular", "psycopg2"]
known_first_party = ["Auto_Deal_Platform"]
default_section = "THIRDPARTY"
skip = ["migrations", ".venv", "node_modules"]
skip_glob = ["**/migrations/*.py", "**/__pycache__/*.py"]
